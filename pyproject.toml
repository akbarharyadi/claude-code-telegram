[project]
name = "claude-code-telegram"
version = "0.1.0"
description = "Drive Claude Code from Telegram, and push messages, screenshots and files back into Telegram from a Claude Code session via MCP."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["claude", "claude-code", "telegram", "bot", "mcp", "ai", "coding-agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Build Tools",
]
dependencies = [
    "python-telegram-bot>=21.6",
    "python-dotenv>=1.0.1",
    "mcp>=1.2.0",
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/OWNER/claude-code-telegram"
Issues = "https://github.com/OWNER/claude-code-telegram/issues"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
